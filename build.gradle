group          = "com.etendoerp"
version        = "3.3.0"
description    = "Etendo Copilot Platform"
ext.artifact   = "copilot"
ext.langchain4jVersion = "1.19.3"
ext.repository = "https://maven.pkg.github.com/etendosoftware/com.etendoerp.copilot.extensions"

configurations {
    moduleDependencyContainer
}

publishing {
    publications {
        "com.etendoerp.copilot"(MavenPublication) {
            from components.java
            groupId = group
            artifactId = artifact
            version = version
        }
    }
    repositories {
        maven {
            url "https://maven.pkg.github.com/etendosoftware/com.etendoerp.copilot.extensions"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs("etendo-resources")
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.pkg.github.com/etendosoftware/com.etendoerp.copilot.extensions"
    }
}

/**
 * Declare Java dependencies using 'implementation'
 * Ex: implementation "com.sun.mail:javax.mail:1.6.2"
 */
dependencies {
    implementation('com.konghq:unirest-java:3.14.5')
    implementation('com.etendoerp:webhookevents:3.1.0')
    implementation('com.etendoerp:docker:3.2.0')
    implementation('com.etendoerp:openapi:3.1.0')
    implementation('com.etendoerp:task:4.2.0')
    implementation('com.etendoerp:telemetry:4.2.0')

    implementation('com.etendoerp.platform:etendo-core:[26.1.0,26.3.0)')

    /*
     * Java-native agent runtime (copilot.engine=java in Openbravo.properties).
     * Only needed to run an agent inside Tomcat without the Python container; the Python
     * engine keeps working untouched when these jars are present.
     *
     * LangChain4j is aligned at 1.19.3. The published MCP integration uses the
     * matching 1.19.3-beta29 artifact version and depends on the same LangChain4j core.
     * Its Jackson requirement is 2.22.1; keep the application's Jackson jars aligned
     * with the resolved dependency graph. Newly introduced dependencies exclude Log4j
     * because Etendo supplies its own runtime Log4j jars.
     */
    implementation("dev.langchain4j:langchain4j:${langchain4jVersion}")
    implementation("dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}")
    implementation("dev.langchain4j:langchain4j-anthropic:${langchain4jVersion}")
    implementation("dev.langchain4j:langchain4j-google-ai-gemini:${langchain4jVersion}")
    implementation("dev.langchain4j:langchain4j-ollama:${langchain4jVersion}")
    implementation("dev.langchain4j:langchain4j-mcp:1.19.3-beta29") {
        exclude group: 'org.apache.logging.log4j'
    }
    implementation('org.apache.pdfbox:pdfbox:3.0.5') {
        exclude group: 'org.apache.logging.log4j'
    }
}
